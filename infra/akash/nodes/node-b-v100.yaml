version: '2.0'
services:
  node-b-v100:
    image: vllm/vllm-openai:v0.6.2
    expose:
    - port: 8000
      as: 8000
      to:
      - global: true
    args:
    - --model
    - Qwen/Qwen2.5-1.5B-Instruct
    - --served-model-name
    - Qwen/Qwen2.5-1.5B-Instruct
    - --dtype
    - float16
    - --max-model-len
    - '4096'
    env:
    - HUGGING_FACE_HUB_TOKEN=
profiles:
  compute:
    node-b-v100:
      resources:
        cpu:
          units: 4
        memory:
          size: 16Gi
        storage:
        - size: 50Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
              - model: v100
  placement:
    dcloud:
      attributes:
        host: akash
      pricing:
        node-b-v100:
          denom: uact
          amount: 400000
deployment:
  node-b-v100:
    dcloud:
      profile: node-b-v100
      count: 1
